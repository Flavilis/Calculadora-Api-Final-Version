<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora API</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora API</h1>
        <p>Bem-vindo à Calculadora API!</p>

        <select name="Operacao" id="operacao">
            <option value="somar">Soma</option>
            <option value="subtrair">Subtração</option>
            <option value="multiplicar">Multiplicação</option>
            <option value="dividir">Divisão</option>
            <option value="raiz">Raiz</option>
            <option value="potencia">Potência</option>
        </select>

        <form>
            Número 1: <input type="number" name="num1" required><br><br>
            número 2: <input type="number" name="num2" required><br>
        </form>

        <button type="submit">Mostrar Resultado</button>

        <div>
            <p>Resultado: <span id="resultado"></span></p>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
